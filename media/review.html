<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
  <link rel="stylesheet" href="{{style}}"><title>RBTFlow</title>
</head>
<body>
  <div id="welcome" hidden>打开一个 Git 项目以开始审核。</div>
  <main id="workbench">
    <div class="repository"><button id="selectRoot" class="text" title="切换仓库"></button><button id="settings" class="text" title="当前仓库的默认设置" aria-label="仓库设置">⋯</button></div>
    <nav aria-label="审核模式"><button id="submitMode" type="button">提交</button><button id="browseMode" type="button">审阅</button></nav>
    <div id="status" role="status" aria-live="polite" hidden></div><div id="error" role="alert" hidden></div>
    <div id="pending" class="notice" hidden><span>提交结果待确认</span><small id="pendingContext"></small><button id="reconcile" class="secondary">检查服务器</button><button id="clearPending" class="text">人工核对后清除</button></div>
    <div id="feedbackPending" class="notice" hidden><span>审阅结果待确认</span><small id="feedbackPendingContext"></small><button id="reconcileFeedback" class="secondary">检查服务器</button><button id="clearFeedbackPending" class="text">人工核对后清除</button></div>
    <section id="submitSection">
      <div class="context"><button id="target" class="text" title="更改目标主线"></button><button id="new" class="text" title="保留仓库默认值，新建审核">新建</button></div>
      <div id="editing" class="context" hidden><span id="editingLabel"></span><button id="viewSaved" class="text">查看服务器版本</button></div>
      <textarea id="summary" rows="2" maxlength="300" placeholder="提交标题" aria-label="提交标题"></textarea>
      <textarea id="description" rows="3" placeholder="修改说明" aria-label="修改说明"></textarea>
      <div class="field"><input id="people" placeholder="审批人，逗号分隔" aria-label="审批人"><button id="peopleSearch" class="text" title="搜索审批人">选择</button></div>
      <input id="bugs" placeholder="Bug / Issue 号" aria-label="Bug 或 Issue 号">
      <details id="more"><summary>更多信息</summary>
        <div class="field"><input id="groups" placeholder="审批组" aria-label="审批组"><button id="groupsSearch" class="text">选择</button></div>
        <textarea id="testing" rows="2" placeholder="测试说明" aria-label="测试说明"></textarea>
        <input id="branch" placeholder="分支展示标签" aria-label="分支展示标签">
        <textarea id="changeDescription" rows="2" placeholder="本次更新说明" aria-label="本次更新说明"></textarea>
        <div class="field"><input id="reviewId" type="number" min="1" placeholder="更新已有审核单 ID" aria-label="更新审核单 ID"><button id="load" class="text">载入</button></div>
        <p class="hint">目标主线、服务器、BASE、审核模式和工具路径位于仓库设置。默认值按仓库保存。</p>
      </details>
      <div class="actions"><button id="preview" class="secondary">预览更改</button><button id="post" disabled>保存草稿</button></div>
      <button id="publish" class="secondary wide" disabled hidden>发布当前草稿</button>
      <details id="rangeDetails" hidden><summary id="counts">对比详情</summary><dl><dt>分支</dt><dd id="gitBranch"></dd><dt>BASE</dt><dd id="baseSha"></dd><dt>HEAD</dt><dd id="headSha"></dd></dl><ul id="warnings"></ul></details>
    </section>
    <section id="browseSection" hidden>
      <div class="field"><input id="browseId" type="number" min="1" placeholder="审核单 ID" aria-label="查看审核单 ID"><button id="openRemote" class="secondary">打开</button><button id="myReviews" class="text" title="选择我的审核">我的…</button></div>
      <div id="remoteDetails" hidden>
        <strong id="remoteTitle"></strong><p id="remoteMeta" class="hint"></p>
        <select id="version" aria-label="差异版本"></select>
        <details><summary>修改说明</summary><p id="remoteDescription" class="prose"></p><p id="remoteTesting" class="prose hint"></p></details>
        <button id="editOwn" class="text" hidden>编辑我的提交</button>
        <div id="feedbackArea">
          <div id="feedbackConflict" class="notice" hidden>服务器审阅草稿已变化，本地意见已保留。<button id="reloadFeedback" class="text">从服务器重新载入</button></div>
          <p id="feedbackRestriction" class="notice" hidden></p>
          <p id="draftBottom" class="prose hint" hidden></p>
          <textarea id="reviewBody" rows="2" placeholder="审阅意见；在 diff 行号处添加行内评论" aria-label="审阅意见"></textarea>
          <label class="checkbox"><input id="shipIt" type="checkbox">Ship It · 同意此版本</label>
          <p id="commentCount" class="hint"></p>
          <div class="actions"><button id="saveFeedback" class="secondary">保存审阅草稿</button><button id="publishFeedback" disabled>发布审阅</button></div>
        </div>
      </div>
    </section>
    <div class="footer"><button id="openUrl" class="text" hidden>在浏览器查看 ↗</button><button id="cancel" class="text" hidden>取消操作</button></div>
  </main>
  <script nonce="{{nonce}}" src="{{script}}"></script>
</body>
</html>
